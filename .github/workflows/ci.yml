name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: Lint & Shell Tests (Ubuntu)
          - runner: windows-latest
            name: PowerShell Tests (Windows)
          - runner: macos-15
            name: Shell Tests (Darwin)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install Linux test shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh fish
          mkdir -p "$RUNNER_TEMP/fish"
          curl --fail --location --silent --show-error \
            https://github.com/fish-shell/fish-shell/releases/download/4.9.3/fish-4.9.3-linux-x86_64.tar.xz \
            -o "$RUNNER_TEMP/fish.tar.xz"
          echo "8f643d10ad1abb0ef7072764c01ceb5cf61b2d373fda400cf60f0bad69b7e095  $RUNNER_TEMP/fish.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/fish.tar.xz" -C "$RUNNER_TEMP/fish" fish
          echo "$RUNNER_TEMP/fish" >> "$GITHUB_PATH"
      - name: Install Darwin test shells
        if: runner.os == 'macOS'
        run: |
          brew install bash fish
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Record runtimes and require PowerShell 7.5+
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version
          if ($PSVersionTable.PSVersion -lt [version]'7.5') { throw 'PowerShell 7.5+ required' }
          $PSVersionTable.PSVersion
          if (-not $IsWindows) {
            foreach ($shell in @('bash', 'zsh', 'fish')) {
              & $shell --version
              if ($LASTEXITCODE -ne 0) { throw "$shell unavailable" }
            }
          }
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Frontend, specialization, CLI, codecs, and real-shell tests
        run: cargo test --all --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check the DSL from file and stdin
        shell: bash
        run: |
          cargo run --quiet --locked -- check examples/env.shed
          cargo run --quiet --locked -- check < examples/env.shed
      - name: Validate release-helper syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/release.sh
          pwsh -NoProfile -Command \
            '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/release.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Out-Host; exit 1 }'

  msrv:
    name: Rust 1.85 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.85.0
      - run: cargo check --all-targets --locked
