name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish verified assets
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shed-*
          merge-multiple: true
          path: dist
      - name: Verify and publish the same bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$TAG" dist/shed-* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
