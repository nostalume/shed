name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  queue: max

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  artifacts:
    name: Build ${{ matrix.artifact }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: shed-linux-x86_64
            binary: shed
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: shed-linux-aarch64
            binary: shed
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: shed-macos-x86_64
            binary: shed
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: shed-macos-aarch64
            binary: shed
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: shed-windows-x86_64.exe
            binary: shed.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Require matching release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $package = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq shed
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:GITHUB_REF_NAME -cne "v$($package.version)") { throw 'tag and Cargo package version must match' }
          git merge-base --is-ancestor HEAD "origin/$env:DEFAULT_BRANCH"
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu
      - name: Build exact target
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Prepare binary and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cp "target/$TARGET/release/$BINARY" "$ARTIFACT"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          else
            shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  packages:
    name: Verify package catalogs
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shed-*
          merge-multiple: true
          path: dist
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}
      - name: Render catalogs from the checked assets
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/update_packages.py "$version" --assets-dir dist
      - name: Evaluate Nix and install the exact Linux artifact
        run: |
          nix flake check --no-build --no-write-lock-file
          nix build --impure --no-write-lock-file --expr 'let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.x86_64-linux; in (pkgs.callPackage ./nix/shed.nix {}).overrideAttrs (_: { src = ./dist/shed-linux-x86_64; })'
          expected=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$(./result/bin/shed --version)" = "shed $expected"
          ./result/bin/shed check examples/env.shed

  publish:
    name: Publish verified assets
    needs: packages
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shed-*
          merge-multiple: true
          path: dist
      - name: Verify and publish the same bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$TAG" dist/shed-* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
